<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your favourite alternate-picking exercises, in your own order.">
  <title>Favourites · Alternate Picking</title>
<style>
    :root {
      --bg: #06151f;
      --panel: #102537;
      --panel-deep: #071921;
      --line: rgba(153, 205, 220, .24);
      --ink: #eff8ff;
      --muted: #a9c1d2;
      --faint: #7895aa;
      --teal: #5be0c7;
      --amber: #f3bd63;
      --shadow: 0 20px 55px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, rgba(91,224,199,.12), transparent 30rem),
        linear-gradient(180deg, #0a1d2b 0, var(--bg) 38rem);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    a { color: inherit; }
    .shell { width: min(100% - 28px, 1800px); margin: 0 auto; }
    .topbar { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid rgba(153,205,220,.18); background: rgba(6,21,31,.88); backdrop-filter: blur(16px); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 70px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 850; letter-spacing: .02em; }
    .brand small { display: block; margin-top: 2px; color: var(--faint); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .brand-mark { width: 24px; height: 24px; border: 2px solid var(--teal); border-radius: 8px; transform: rotate(45deg); box-shadow: 0 0 0 5px rgba(91,224,199,.1); }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn, .pill { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.045); color: var(--muted); text-decoration: none; }
    .btn { padding: 8px 13px; cursor: pointer; }
    .btn:hover { border-color: rgba(91,224,199,.7); color: var(--ink); }
    .btn.primary { border-color: transparent; color: #061b20; background: var(--teal); font-weight: 850; }
    .main { padding: 36px 0 70px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 850px; font-size: clamp(32px, 4vw, 57px); line-height: .98; letter-spacing: -.06em; }
    .lede { max-width: 760px; margin: 12px 0 0; color: var(--muted); font-size: 16px; }
    .source-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; min-width: 230px; }
    .pill { padding: 7px 10px; color: var(--teal); font-size: 11px; font-weight: 800; }
    .toolbar { position: sticky; top: 70px; z-index: 4; display: grid; gap: 10px; margin-bottom: 17px; padding: 11px; border: 1px solid var(--line); border-radius: 15px; background: rgba(16,37,55,.9); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
    .toolbar-row { display: flex; align-items: center; gap: 10px; }
    .search { min-width: 0; flex: 1 1 260px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--ink); background: rgba(255,255,255,.055); }
    .search:focus { border-color: rgba(91,224,199,.75); box-shadow: 0 0 0 3px rgba(91,224,199,.1); }
    .count { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; font-size: 11px; font-weight: 760; }
    .filter:hover { color: var(--ink); border-color: rgba(91,224,199,.6); }
    .filter.active { border-color: transparent; color: #061b20; background: var(--teal); }
    .exercise-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; align-items: start; }
    .exercise-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(145deg, rgba(16,37,55,.97), rgba(7,25,33,.97)); box-shadow: 0 10px 30px rgba(0,0,0,.13); }
    .exercise-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; padding: 13px 14px 11px; border-bottom: 1px solid rgba(153,205,220,.15); }
    .exercise-heading { min-width: 0; }
    .exercise-kicker { margin-bottom: 3px; color: var(--teal); font: 850 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .exercise-title { margin: 0; font-size: 18px; line-height: 1.05; letter-spacing: -.03em; }
    .exercise-sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .exercise-number { display: grid; flex: 0 0 34px; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: #061b20; background: var(--amber); font: 900 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .checks { display: grid; grid-template-columns: repeat(4, 18px); gap: 5px; flex: 0 0 auto; margin-left: auto; }
    .check { position: relative; width: 18px; height: 18px; margin: 0; border: 2px solid var(--c); border-radius: 5px; background: transparent; opacity: .72; cursor: pointer; appearance: none; -webkit-appearance: none; transition: background .12s, opacity .12s; }
    .check:hover { opacity: 1; }
    .check:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .check:checked { background: var(--c); opacity: 1; }
    .check:checked::after { content: ''; position: absolute; left: 4px; top: 0; width: 4px; height: 9px; border: solid #061b20; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .check.c0 { --c: #5be0c7; }
    .check.c1 { --c: #f3bd63; }
    .check.c2 { --c: #ff7f9a; }
    .check.c3 { --c: #8f9cff; }
    .head-side { display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; gap: 4px; }
    .fav { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--faint); background: transparent; font-size: 14px; line-height: 1; cursor: pointer; }
    .fav:hover { color: var(--amber); border-color: var(--amber); }
    .fav:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .fav[aria-pressed="true"] { border-color: transparent; color: #061b20; background: var(--amber); }
    .measure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 8px; padding: 9px; }
    .measure { min-width: 0; padding: 8px 8px 9px; border: 1px solid rgba(91,224,199,.22); border-radius: 11px; background: var(--panel-deep); }
    .measure-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: #d9f5f2; font: 850 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; }
    .measure-label em { overflow: hidden; color: var(--amber); font-size: 9px; font-style: normal; letter-spacing: 0; text-overflow: ellipsis; white-space: nowrap; text-transform: none; }
    .tab-row { display: grid; grid-template-columns: 13px 9px minmax(0, 1fr); align-items: center; min-height: 17px; color: #d6fff6; font: 700 11px/1.18 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .string-number { color: #d9f5f2; }
    .divider { color: var(--faint); }
    .cells { display: grid; grid-template-columns: repeat(var(--events), minmax(0, 1fr)); min-width: 0; }
    .cell { min-width: 0; text-align: center; color: #a7c9d2; }
    .cell.note { color: #effffb; }
    .empty { padding: 34px 12px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }
    .footer { margin-top: 25px; color: var(--faint); font-size: 12px; }
    .footer a { color: var(--teal); }
    @media (max-width: 720px) {
      .shell { width: min(100% - 18px, 600px); }
      .topbar-inner { min-height: 60px; }
      .brand small { display: none; }
      .main { padding-top: 24px; }
      .intro { display: block; }
      .source-badges { justify-content: flex-start; margin-top: 15px; }
      .toolbar { top: 60px; }
      .toolbar-row { display: block; }
      .count { display: block; margin-top: 7px; }
      .exercise-grid { grid-template-columns: 1fr; }
      .measure-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 1500px) { .exercise-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  </style>
  <style>
    .exercise-card[draggable="true"] { cursor: grab; }
    .exercise-card.dragging { opacity: .45; }
    .exercise-card.drop-before { box-shadow: -6px 0 0 var(--teal); }
    .exercise-card.drop-after { box-shadow: 6px 0 0 var(--teal); }
    .fav-tools { display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; color: var(--faint); font-size: 11px; }
    .fav-tools span { flex: 1; }
    .fav-tools button { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
    .fav-tools button:hover:not(:disabled) { color: var(--ink); border-color: rgba(91,224,199,.7); }
    .fav-tools button:disabled { opacity: .3; cursor: default; }
    .empty a { color: var(--teal); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="index.html" aria-label="All Exercises home"><span class="brand-mark" aria-hidden="true"></span><span>Favourites<small>alternate picking source sheets</small></span></a>
      <nav class="top-actions"><a class="btn" href="index.html">← All exercises</a></nav>
    </div>
  </header>

  <main class="shell main">
    <section class="intro">
      <div>
        <p class="eyebrow">Your picks</p>
        <h1>Favourites</h1>
        <p class="lede">Drag a card, or use the arrows, to put your favourites in the order you want to practise them.</p>
      </div>
      <div class="source-badges"><span class="pill" id="count"></span></div>
    </section>
    <section id="exerciseGrid" class="exercise-grid" aria-live="polite"></section>
  </main>

  <script src="data.js?v=2"></script>
  <script>
    (() => {
      const exercises = window.AP_DATA?.exercises || [];
      const $ = (selector) => document.querySelector(selector);
      const grid = $('#exerciseGrid');

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      const STORE_KEY = 'ap-exercise-checks-v1';
      const checked = new Set();
      try { JSON.parse(localStorage.getItem(STORE_KEY) || '[]').forEach((key) => checked.add(key)); } catch (e) {}
      function saveChecks() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...checked])); } catch (e) {} }

      const FAV_KEY = 'ap-exercise-favs-v1';
      let favs = [];
      try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || '[]').map(String); } catch (e) {}
      function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {} }
      const isFav = (id) => favs.includes(String(id));

      function checksMarkup(id) {
        let html = '';
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 4; col++) {
            const key = `${id}:${row}:${col}`;
            html += `<input class="check c${col}" type="checkbox" data-key="${key}" aria-label="Exercise ${id}, row ${row + 1}, column ${col + 1}"${checked.has(key) ? ' checked' : ''}>`;
          }
        }
        return `<div class="checks" role="group" aria-label="Exercise ${id} checkboxes">${html}</div>`;
      }

      function measureMarkup(measure) {
        const notes = measure.notes || [];
        const events = notes.length || 1;
        const rows = Array.from({ length: 6 }, (_, index) => {
          const stringNumber = index + 1;
          const cells = notes.map((note) => {
            const active = note.string === stringNumber;
            return `<span class="cell${active ? ' note' : ''}">${active ? esc(note.fret) : '·'}</span>`;
          }).join('');
          return `<div class="tab-row"><span class="string-number">${stringNumber}</span><span class="divider">|</span><span class="cells" style="--events:${events}">${cells}</span></div>`;
        }).join('');
        return `<section class="measure"><div class="measure-label"><span>Measure ${esc(measure.measure)} · 4/4</span>${measure.text ? `<em>${esc(measure.text)}</em>` : ''}</div>${rows}</section>`;
      }

      function cardMarkup(exercise) {
        const measures = (exercise.measurePatterns || []).map(measureMarkup).join('');
        return `<article class="exercise-card"><header class="exercise-head"><div class="exercise-heading"><div class="exercise-kicker">${esc(exercise.sectionLabel?.split(' · ')[0] || 'Exercise')}</div><h2 class="exercise-title">${esc(exercise.title)}</h2><p class="exercise-sub">m. ${esc(exercise.bars)} · ${esc(exercise.patternLabel)} · ${esc(exercise.totalNotes)} notes</p></div>${checksMarkup(exercise.id)}<div class="head-side"><span class="exercise-number" aria-label="Exercise ${exercise.id}">${String(exercise.id).padStart(2, '0')}</span><button class="fav" type="button" data-id="${esc(exercise.id)}" aria-pressed="${isFav(exercise.id)}" aria-label="Favourite exercise ${exercise.id}" title="Favourite">★</button></div></header><div class="measure-grid">${measures}</div></article>`;
      }

      
      favs = favs.filter((id) => exercises.some((exercise) => String(exercise.id) === id));

      function render() {
        const list = favs.map((id) => exercises.find((exercise) => String(exercise.id) === id));
        $('#count').textContent = `${list.length} favourite${list.length === 1 ? '' : 's'}`;
        grid.innerHTML = list.length ? list.map((exercise, i) => cardMarkup(exercise).replace('<article class="exercise-card">', `<article class="exercise-card" draggable="true" data-id="${esc(exercise.id)}"><div class="fav-tools"><span>Drag to reorder</span><button type="button" data-move="-1" aria-label="Move earlier"${i === 0 ? ' disabled' : ''}>←</button><button type="button" data-move="1" aria-label="Move later"${i === list.length - 1 ? ' disabled' : ''}>→</button></div>`)).join('') : '<div class="empty">No favourites yet. Press the ★ on any exercise to add it here. <a href="index.html">Back to all exercises</a></div>';
      }

      grid.addEventListener('click', (event) => {
        const card = event.target.closest('.exercise-card');
        if (!card) return;
        const i = favs.indexOf(card.dataset.id);
        const move = event.target.closest('[data-move]');
        if (event.target.closest('.fav')) favs.splice(i, 1);
        else if (move) {
          const j = i + Number(move.dataset.move);
          if (j < 0 || j >= favs.length) return;
          favs.splice(j, 0, favs.splice(i, 1)[0]);
        } else return;
        saveFavs();
        render();
      });

      grid.addEventListener('change', (event) => {
        const box = event.target;
        if (!box.classList || !box.classList.contains('check')) return;
        if (box.checked) checked.add(box.dataset.key); else checked.delete(box.dataset.key);
        saveChecks();
      });

      let dragId = null;
      const clearMarks = () => document.querySelectorAll('.drop-before, .drop-after, .dragging').forEach((el) => el.classList.remove('drop-before', 'drop-after', 'dragging'));
      grid.addEventListener('dragstart', (event) => {
        const card = event.target.closest?.('.exercise-card');
        if (!card) return;
        dragId = card.dataset.id;
        card.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', dragId);
      });
      grid.addEventListener('dragover', (event) => {
        if (dragId === null) return;
        event.preventDefault();
        document.querySelectorAll('.drop-before, .drop-after').forEach((el) => el.classList.remove('drop-before', 'drop-after'));
        const card = event.target.closest('.exercise-card');
        if (!card || card.dataset.id === dragId) return;
        const box = card.getBoundingClientRect();
        card.classList.add(event.clientX < box.left + box.width / 2 ? 'drop-before' : 'drop-after');
      });
      grid.addEventListener('drop', (event) => {
        if (dragId === null) return;
        event.preventDefault();
        const card = event.target.closest('.exercise-card');
        if (card && card.dataset.id !== dragId) {
          const box = card.getBoundingClientRect();
          favs = favs.filter((id) => id !== dragId);
          favs.splice(favs.indexOf(card.dataset.id) + (event.clientX >= box.left + box.width / 2 ? 1 : 0), 0, dragId);
          saveFavs();
          render();
        }
        dragId = null;
      });
      grid.addEventListener('dragend', () => { dragId = null; clearMarks(); });
      window.addEventListener('pageshow', (event) => { if (event.persisted) location.reload(); });

      if (!exercises.length) grid.innerHTML = '<div class="empty">Exercise data could not be loaded. Open this page from the project folder so data.js can load beside it.</div>';
      else render();
    })();
  </script>
</body>
</html>
